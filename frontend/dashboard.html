<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - FairAI</title>

  <link rel="stylesheet" href="./css/main/main.css" />
  <link rel="stylesheet" href="./css/components/navbar.css" />
  <link rel="stylesheet" href="./css/components/dashboard/dashboard.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">F</div>
        FairAI
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
      </ul>
    </div>
  </nav>

  <div class="container dashboard-content">
    <div class="page-header animate-fade-up">
      <h1>AI Bias Analyzer</h1>
      <p>Upload any CSV file. FairAI will automatically scan for potential bias patterns.</p>
    </div>

    <div class="dashboard-flex">
      <div class="upload-zone animate-fade-up delay-1" id="uploadZone">
        <img src="./assests/csv.png" class="upload-icon" alt="CSV" />
        <h3>Upload CSV Dataset</h3>
        <p>Drop your file here or browse</p>

        <div class="cta-buttons">
          <label for="csvInput">Browse Files</label>
          <input type="file" id="csvInput" accept=".csv" />
        </div>
      </div>
    </div>

    <div class="card empty-state animate-fade-up delay-3" id="statusCard">
      <span><img src="./assests/analysis.png" width="56" height="56" alt="Analysis" /></span>
      <p id="statusText">Waiting for CSV upload.</p>
    </div>
  </div>

  <script src="js/upload.js"></script>
  <script src="js/main.js"></script>
  <script>
    const statusText = document.getElementById('statusText');

    window.onCSVFileSelected = async function(file) {
      statusText.textContent = 'Analyzing dataset with AI...';

      try {
        const result = await window.fairaiAPI.analyzeCsvFile(file);
        sessionStorage.setItem('fairai_result', JSON.stringify(result));
        window.location.href = 'result.html';
      } catch (err) {
        statusText.textContent = 'Analysis failed. Check backend/API key and retry.';
        alert(err.message || 'Analysis failed.');
      }
    };
  </script>
</body>
</html>
